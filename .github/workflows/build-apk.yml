name: React Native CI/CD

on:
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - prod-apk

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: App
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📦 Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: 📋 Fix package.json main entry
        run: |
          if ! command -v jq &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y jq
          fi
          jq '.main = "node_modules/expo/AppEntry.js"' package.json > package.json.tmp && mv package.json.tmp package.json

      - name: 📱 Build APK
        run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          eas build --platform android --profile preview --local --non-interactive --output=./app-release.apk

      - name: 📦 Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QualityLuchtSensor
          path: App/app-release.apk
          retention-days: 7
